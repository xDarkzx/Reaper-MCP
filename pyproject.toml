[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdarkzx-reaper-mcp"
version = "0.6.8"
description = "MCP server for AI-driven music production in REAPER via file-based IPC with a Lua bridge"
license = "Apache-2.0"
authors = [
    { name = "Daniel Hodgetts" },
]
readme = "README.md"
keywords = ["reaper", "mcp", "audio", "ai", "model-context-protocol", "daw", "music-production"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
requires-python = ">=3.10"
dependencies = [
    # Upper-bounded deliberately: mcp 2.0.0 is a real, confirmed breaking
    # release (removed/restructured mcp.server.fastmcp, which every tool
    # module in this project imports) that broke CI on a commit that
    # changed nothing dependency-related - a fresh `pip install` alone
    # was enough to pull it in under the old unbounded ">=1.0.0" pin.
    # Bump the ceiling only after actually testing against a real 2.x
    # release. (Same issue hit and fixed the same way in SongForge-MCP.)
    "mcp[cli]>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff==0.16.5",
]
analysis = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
]

[tool.ruff.lint]
# Real bugs (F, pyflakes) and real security patterns (S, bandit port) -
# deliberately excludes E/W (pycodestyle style/formatting).
select = ["F", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests are written - not a stripped-under-`-O`
# production risk, since tests never ship or run with -O.
"tests/*" = ["S101"]

[tool.hatch.build.targets.wheel]
packages = ["reaper_mcp", "reaper_mcp_shared"]

[project.scripts]
reaper-mcp = "reaper_mcp.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
